name: Update Rules

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Build And Update Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build rules
        env:
          MYSHUNTRULES_STRICT_FETCH: "1"
        run: python build.py

      - name: Run validation
        run: python scripts/validate.py

      - name: Run tests
        run: pytest -q

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- README.md dist)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected generated changes in README.md or dist/."
            git status --short -- README.md dist
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes detected."
          fi

      - name: Commit and push generated files
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dist
          if git diff --cached --quiet; then
            echo "No staged changes to commit after git add."
            exit 0
          fi
          git commit -m "chore(rules): auto update rules"
          git push

      - name: Finish without changes
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "Workflow completed without generated changes."
