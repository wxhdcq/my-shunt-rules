name: Update Rules

"on":
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: "Allow a reviewed rule-count reduction above 20% (empty outputs still fail)"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build And Update Rules
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build rules
        env:
          MYSHUNTRULES_STRICT_FETCH: "1"
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop }}
        run: |
          if [[ "$ALLOW_LARGE_DROP" == "true" ]]; then
            python build.py --allow-large-drop
          else
            python build.py
          fi

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- README.md dist sources/custom/hong-kong-banks.txt sources/custom/us-banks.txt sources/custom/us-financial-services.txt)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected generated changes in bank sources, README.md, or dist/."
            git status --short -- README.md dist sources/custom/hong-kong-banks.txt sources/custom/us-banks.txt sources/custom/us-financial-services.txt
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes detected."
          fi

      - name: Commit and push generated files
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dist sources/custom/hong-kong-banks.txt sources/custom/us-banks.txt sources/custom/us-financial-services.txt
          if git diff --cached --quiet; then
            echo "No staged changes to commit after git add."
            exit 0
          fi
          git commit -m "chore(rules): auto update rules"
          git push

      - name: Finish without changes
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "Workflow completed without generated changes."
